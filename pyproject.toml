[project]
name = "sem-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SagarBhuniya", email = "sagarbhuniya06@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "better-profanity>=0.7.0",
    "datasets>=5.1.0",
    "detoxify>=0.5.4",
    "langchain-core>=1.7.3",
    "langgraph>=1.2.19",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "typer>=0.27.3",
]

[project.scripts]
sem-project = "sem_project:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
